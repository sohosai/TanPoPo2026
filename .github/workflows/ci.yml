name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      # styled-system は gitignore されている生成物のため、型チェック前に生成する。
      - run: bun run --cwd apps/web prepare

      - name: Format
        run: bun run format:check

      - name: Type check
        run: bun run check

      - name: Map data
        run: bun run check:map-data

      - name: Build
        run: bun run build
